# Example show whitelist for the `show` tool.
# Validation is performed by netmiko-mcp 0.3.0 (default-deny; deny wins).
# Config actions never go through this file; they use the fixed wrapper tools.
# Changes take effect only after a server restart (lru_cache).
allowed_commands:
  - show system information
  - show clock
  - show privilege
  - show users
  - show vlan
  - show vlan *
  - show mac-address-table
  - show mac-address-table *
  - show power inline
  - show power inline *
  - show power detail
  - show lldp
  - show lldp neighbors
  - show lldp neighbors *
  - show lldp local *
  - show lldp interface *
  - show logging
  - show spanning-tree
  - show spanning-tree *
  - show etherchannel
  - show etherchannel *
  - show ip interface
  - show ip arp
  - show ip route
  - show interface port-security
  - show interface *
  - show interfaces
  - show interfaces *
  - show interfaces description
  - show flow-control
  - show eee
  - show jumbo-frame
  - show sntp status
  - show ssh-configurations
  - show telnet server
  - show http server status
  - show lbd state
  - show lbd port state
  # SNMP read-back. show snmp community is redacted by the wrapper.
  # The documented view command is show snmp viewtree (Linksys CLI
  # manual); show snmp view is allow-listed only as an unconfirmed alias.
  - show snmp community
  - show snmp viewtree
  - show snmp view
  - show snmp group
  - show snmp group access
  - show snmp user
denied_commands:
  # Active tests / secrets / config dumps
  - show interface cable-diag*
  # Broader SNMP dumps stay denied (deny wins). Do not add show snmp*.
  - show snmp engineid*
  - show snmp engineID*
  - show snmp target*
  - show snmp notif*
  - show radius*
  - show running-config*
  - show current*
  - show startup-config*
  # Changing commands (defense in depth, also covers abbreviations)
  - configure*
  - save*
  - write*
  - reboot*
  - reload*
  - restore-defaults*
  - clear*
  - copy*
  - erase*
  - delete*
  - set*
  - no *
  - username*
  - ping*
  - traceroute*
  - lock*
  - debug*
  - interface*
  - shutdown*
  - power*
  - description*
  - end*
  - exit*
